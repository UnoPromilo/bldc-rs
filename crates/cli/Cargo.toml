[package]
name = "pyrion-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pyrionctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive", "env"] }
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"

[build-dependencies]
tonic-prost-build = "0.14.2"
